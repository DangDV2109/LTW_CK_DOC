<g class="node" data-id="Controllers" data-label="Controllers &amp; Business Logic
- Chặn tạo suất chiếu chồng giờ trong cùng phòng
- Chặn đặt trùng ghế (HTTP 409 Conflict)
- Kiểm tra điều kiện hủy vé trước giờ chiếu &gt;= 2 tiếng
- Thống kê doanh thu bằng Aggregation Pipeline ($group)" data-shape="rectangle">
